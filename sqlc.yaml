version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/storage/postgres/migrations"
    queries: "internal/storage/postgres/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/storage/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        # Имена db_type различаются между версиями sqlc, поэтому для каждого типа указаны оба написания.
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"

          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }

          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "pg_catalog.date"
            go_type: "time.Time"
          - db_type: "pg_catalog.date"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }

          - db_type: "numeric"
            go_type: "float64"
          - db_type: "numeric"
            nullable: true
            go_type: { type: "float64", pointer: true }
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: { type: "float64", pointer: true }

          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"

          - db_type: "inet"
            go_type: "net/netip.Prefix"
          - db_type: "inet"
            nullable: true
            go_type: { import: "net/netip", type: "Prefix", pointer: true }
