        cover_letter:
          type: string
        id:
          type: string
        invitation_id:
          type: string
        reject_reason:
          type: string
        responded_at:
          format: date-time
          type: string
        sent_at:
          format: date-time
          type: string
        status:
          enum:
            - sent
            - viewed
            - invited
            - rejected
            - withdrawn
          type: string
        vacancy:
