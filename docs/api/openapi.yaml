                $ref: "#/components/schemas/CountOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Отметить все прочитанными
      tags:
        - notifications
  /notifications/{id}/read:
    post:
      operationId: notification-read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Отметить прочитанным
      tags:
        - notifications
  /public/verify/{id}:
    get:
      description: "Без аутентификации и без персональных данных: категории кандидата, их статусы и связь с ФСП ID. 404 — кандидат скрыл профиль, отозвал согласие на публикацию или ещё не проходил тест."
      operationId: public-verify
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Подтверждение категории по QR-коду
      tags:
        - candidate
  /refdata:
    get:
      description: Специализации, грейды, форматы работы, причины отказа, дисциплины и уровни ФСП, группы навыков, темы заданий.
      operationId: refdata-get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefdataOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Справочники
      tags:
        - refdata
  /skills:
    get:
      description: Поиск по названию и синонимам; используется автодополнением в анкете и потребности.
      operationId: skills-list
      parameters:
        - description: Подстрока названия или синонима
          explode: false
          in: query
          name: q
          schema:
            description: Подстрока названия или синонима
            maxLength: 64
            type: string
        - description: Фильтр по специализации
          explode: false
          in: query
          name: spec
          schema:
            description: Фильтр по специализации
            enum:
              - backend
              - frontend
              - data_ml
              - devops
              - qa
              - security
              - common
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Справочник навыков
      tags:
        - refdata
  /vacancies:
    get:
      description: Публичный список без аутентификации. Вилка показывается всегда — это обязательное условие платформы.
      operationId: vacancies-list
      parameters:
        - explode: false
          in: query
          name: specialization
          schema:
            enum:
              - backend
              - frontend
              - data_ml
              - devops
              - qa
              - security
              - ""
            type: string
        - description: Грейд входит в диапазон вакансии
          explode: false
          in: query
          name: grade
          schema:
            description: Грейд входит в диапазон вакансии
            enum:
              - junior
              - middle
              - senior
              - ""
            type: string
        - explode: false
          in: query
          name: work_format
          schema:
            enum:
              - office
              - hybrid
              - remote
              - ""
            type: string
        - description: Город; удалённые вакансии показываются всегда
          explode: false
          in: query
          name: city
          schema:
            description: Город; удалённые вакансии показываются всегда
            maxLength: 80
            type: string
        - description: Верх вилки не ниже этой суммы
          explode: false
          in: query
          name: salary_min
          schema:
            description: Верх вилки не ниже этой суммы
            format: int64
            minimum: 0
            type: integer
        - description: Поиск по названию вакансии и компании
          explode: false
          in: query
          name: q
          schema:
            description: Поиск по названию вакансии и компании
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Опубликованные вакансии
      tags:
        - vacancies
  /vacancies/{id}:
    get:
      operationId: vacancy-get
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVacancy"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Вакансия
      tags:
        - vacancies
  /vacancies/{id}/apply:
    post:
      description: "Отклик открывает компании контакты кандидата (правило ТЗ 2.2). Ошибки: 409 profile_required, 409 application_exists, 404 vacancy."
      operationId: vacancy-apply
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacancyApplyInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Откликнуться на вакансию
      tags:
        - applications
servers:
  - description: Текущий сервер
    url: /api/v1
