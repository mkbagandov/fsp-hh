components:
  schemas:
    AcceptResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AcceptResult.json
          format: uri
          readOnly: true
          type: string
        company_contacts:
          additionalProperties:
            type: string
          type: object
        contact_method:
          $ref: "#/components/schemas/ContactMethod"
        invitation:
          $ref: "#/components/schemas/Invitation"
      required:
        - invitation
        - contact_method
        - company_contacts
      type: object
    AcceptedOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AcceptedOutBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
      required:
        - message
      type: object
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
      required:
        - message
      type: object
    Achievement:
      additionalProperties: false
      properties:
        discipline:
          enum:
            - algorithmic
            - product
            - security
            - robotics
            - uav
          type: string
        event_date:
          format: date-time
          type: string
        event_name:
          type: string
        external_id:
          type: string
        fetched_at:
          format: date-time
          type: string
        level:
          enum:
            - regional
            - national
            - international
          type: string
        place:
          format: int32
          type: integer
        rank_title:
          type: string
        rating:
          format: int32
          type: integer
        result_kind:
          enum:
            - place
            - rank
            - rating
            - participation
          type: string
        role:
          type: string
        team_name:
          type: string
        verified:
          type: boolean
      required:
        - external_id
        - discipline
        - level
        - event_name
        - event_date
        - result_kind
        - verified
        - fetched_at
      type: object
    AchievementsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AchievementsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Achievement"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    AdminAcceptedOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AdminAcceptedOutBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
      required:
        - message
      type: object
    Answer:
      additionalProperties: false
      properties:
        keys:
          items:
            type: string
          type:
            - array
            - "null"
        number:
          format: double
          type: number
        order:
          items:
            type: string
          type:
            - array
            - "null"
        order_insensitive:
          type: boolean
        rows:
          items:
            items:
              type: string
            type:
              - array
              - "null"
          type:
            - array
            - "null"
        text:
          type: string
        tolerance:
          format: double
          type: number
      type: object
