    VerifiedCategory:
      additionalProperties: false
      properties:
        confirmed_at:
          format: date-time
          type: string
        grade:
          type: string
        is_primary:
          type: boolean
        percentile:
          format: double
          type: number
        specialization:
          type: string
        status:
          enum:
            - claimed
            - confirmed
            - not_confirmed
            - upgrade_suggested
          type: string
      required:
        - specialization
        - grade
        - status
        - is_primary
      type: object
    VerifyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/VerifyInputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
        email:
          format: email
          type: string
      required:
        - email
        - code
      type: object
    VersionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/VersionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/SelectionVersionSummary"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Weights:
      additionalProperties: false
      properties:
        fit:
          format: double
          type: number
        fresh:
          format: double
          type: number
        fsp:
          format: double
          type: number
        skills:
          format: double
          type: number
        test:
          format: double
          type: number
      required:
        - test
        - skills
        - fsp
        - fresh
        - fit
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access-токен из /auth/login, /auth/verify или /auth/refresh
      scheme: bearer
      type: http
info:
  description: "API платформы подбора ИТ-специалистов с обратной механикой: кандидаты распределяются по категориям «специализация × грейд» по результатам опроса и тестирования, работодатель находит категорию и приглашает конкретного кандидата. Ошибки возвращаются в формате application/problem+json (RFC 9457); поле `errors[].value` содержит машиночитаемый код ошибки. Аутентификация: заголовок `Authorization: Bearer <access_token>`, refresh-токен — в HttpOnly cookie `fsp_refresh`."
  title: ФСП — платформа найма ИТ-специалистов
  version: dev
openapi: 3.1.0
paths:
  /admin/audit:
    get:
      operationId: admin-audit
      parameters:
        - description: "Префикс действия: invitation., application., admin."
          explode: false
          in: query
          name: action
          schema:
            description: "Префикс действия: invitation., application., admin."
            maxLength: 80
            type: string
        - description: Часть e-mail актора
          explode: false
          in: query
          name: actor
          schema:
            description: Часть e-mail актора
            maxLength: 120
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Журнал аудита
      tags:
        - admin
  /admin/employers:
    get:
      description: "Доля принятых приглашений среди ответивших: good ≥ 50 %, normal ≥ 25 %, low — ниже; new — меньше трёх ответов."
      operationId: admin-employers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Работодатели и репутация
      tags:
        - admin
  /admin/items:
    get:
      description: Экспозиция, доля верных, среднее время, оценка дискриминативности (разница θ верно/неверно ответивших) и предупреждения о слабых семействах — первыми.
      operationId: admin-item-stats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamiliesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Статистика банка заданий
      tags:
        - admin
  /admin/items/recalibrate:
    post:
      description: "Байесовская калибровка сложности b по ответам завершённых сессий: κ = 20, от 30 ответов на семейство — тот же расчёт, что проверен валидацией. Всегда от априорной сложности, поэтому повторный запуск безопасен. Выполняется и автоматически раз в сутки."
      operationId: admin-items-recalibrate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationReport"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Пересчитать сложность заданий по живым ответам
      tags:
        - admin
  /admin/items/{id}/enabled:
    post:
      operationId: admin-item-enabled
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 200
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyEnabledInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAcceptedOutBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Включить или выключить семейство
      tags:
        - admin
  /admin/overview:
    get:
      description: Пользователи, категории, тест-сессии, приглашения, отклики, вакансии, воронка кандидата и активность по дням.
      operationId: admin-overview
      parameters:
        - description: Глубина дневной активности, по умолчанию 14
          explode: false
          in: query
          name: days
          schema:
            description: Глубина дневной активности, по умолчанию 14
            format: int64
            maximum: 90
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Сводка платформы
      tags:
        - admin
  /admin/sessions/flagged:
    get:
      description: Потери фокуса, скрытие вкладки, вставка. Подозрительные (много событий при высокой доле верных) — первыми. Автоматических санкций нет.
      operationId: admin-flagged-sessions
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsOutputBody1"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Сессии с флагами телеметрии
      tags:
        - admin
  /admin/users:
    get:
      operationId: admin-users
      parameters:
        - description: Часть e-mail
          explode: false
          in: query
          name: q
          schema:
            description: Часть e-mail
            maxLength: 120
            type: string
        - explode: false
          in: query
          name: role
          schema:
            enum:
              - candidate
              - employer
              - admin
              - ""
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - active
              - blocked
              - deleted
              - ""
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Пользователи
      tags:
        - admin
  /admin/users/{id}/status:
    post:
      description: Нельзя менять себя и других администраторов. Действие пишется в аудит.
      operationId: admin-user-status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Заблокировать или разблокировать
      tags:
        - admin
  /admin/vacancies:
    get:
      operationId: admin-vacancies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacanciesOutputBody1"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Вакансии платформы (модерация)
      tags:
        - admin
  /admin/vacancies/{id}/hide:
    post:
      description: Статус становится closed; причина — в аудите. 409 invalid_transition, если вакансия не опубликована.
      operationId: admin-vacancy-hide
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HideInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAcceptedOutBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Снять вакансию с публикации
      tags:
        - admin
  /auth/account:
    delete:
      description: Учётная запись помечается удалённой, e-mail обезличивается, персональные данные кандидата (контакты, резюме, опыт, образование, навыки, данные ФСП) стираются, доступы работодателей к контактам отзываются, все сессии закрываются — в том числе уже выданный access-токен.
      operationId: auth-account-delete
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Удаление учётной записи
      tags:
        - auth
  /auth/account/export:
    get:
      operationId: auth-account-export
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Выгрузка данных учётной записи (152-ФЗ)
      tags:
        - auth
  /auth/consents:
    post:
      description: publication — на показ профиля работодателям; fsp_data — на получение достижений из реестра ФСП.
      operationId: auth-consent-give
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Выдать согласие
      tags:
        - auth
  /auth/consents/{kind}:
    delete:
      description: Согласие на обработку отозвать нельзя — используйте удаление аккаунта (409 consent_processing_required).
      operationId: auth-consent-withdraw
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            enum:
              - publication
              - fsp_data
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Отозвать согласие
      tags:
        - auth
  /auth/fsp/callback:
    get:
      description: Проверяет state и nonce, обменивает код на токены, входит/регистрирует или привязывает ФСП ID, синхронизирует достижения, ставит refresh-cookie и перенаправляет на фронтенд (`return_to`, при ошибке — с `?fsp_error=`).
      operationId: auth-fsp-callback
      parameters:
        - explode: false
          in: query
          name: code
          schema:
            type: string
        - explode: false
          in: query
          name: state
          schema:
            type: string
        - explode: false
          in: query
          name: error
          schema:
            type: string
        - explode: false
          in: query
          name: error_description
          schema:
            type: string
        - in: cookie
          name: fsp_oidc
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Возврат из ФСП ID
      tags:
        - auth
        - fsp
  /auth/fsp/link:
    delete:
      description: Удаляет привязку и кэш достижений, отзывает согласие fsp_data.
      operationId: auth-fsp-unlink
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Отвязать ФСП ID
      tags:
        - auth
        - fsp
    get:
      operationId: auth-fsp-link-get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FSPLinkInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Состояние привязки ФСП ID
      tags:
        - auth
        - fsp
  /auth/fsp/start:
    post:
      description: Возвращает адрес авторизации (OpenID Connect, Authorization Code + PKCE) и ставит cookie с подписанным состоянием. Браузер перенаправляется на ФСП ID, после входа ФСП ID возвращает на /auth/fsp/callback. Ошибка 503 fsp_id_disabled, если провайдер не настроен.
      operationId: auth-fsp-start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FspStartInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FspStartOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Начать вход или привязку через ФСП ID
      tags:
        - auth
        - fsp
  /auth/login:
    post:
      description: "Ошибки: 401 invalid_credentials, 403 email_not_verified, 403 user_blocked."
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Вход по e-mail и паролю
      tags:
        - auth
  /auth/logout:
    post:
      operationId: auth-logout
      parameters:
        - in: cookie
          name: fsp_refresh
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Выход (отзыв refresh-токена)
      tags:
        - auth
  /auth/me:
    get:
      operationId: auth-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Текущий пользователь и согласия
      tags:
        - auth
  /auth/password/change:
    post:
      description: Закрывает все остальные сессии. Ошибка 422 password_wrong.
      operationId: auth-password-change
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Смена пароля
      tags:
        - auth
  /auth/password/forgot:
    post:
      operationId: auth-password-forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Запрос кода для сброса пароля
      tags:
        - auth
  /auth/password/reset:
    post:
      description: Устанавливает новый пароль, подтверждает e-mail и закрывает все сессии. Ошибка 422 code_invalid.
      operationId: auth-password-reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Сброс пароля по коду
      tags:
        - auth
  /auth/refresh:
    post:
      description: Ротирует refresh-токен (старый отзывается). Повторное использование отозванного токена закрывает все сессии пользователя. Ошибка 401 refresh_invalid.
      operationId: auth-refresh
      parameters:
        - in: cookie
          name: fsp_refresh
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Обновление сессии по refresh-cookie
      tags:
        - auth
  /auth/register:
    post:
      description: "Создаёт учётную запись кандидата или работодателя и отправляет 6-значный код на e-mail. Требуется согласие на обработку персональных данных. Ошибки: 409 email_taken, 422 consent_required."
      operationId: auth-register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Регистрация по e-mail
      tags:
        - auth
  /auth/verify:
