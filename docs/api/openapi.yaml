          examples:
            - /api/v1/schemas/AnswerResult.json
          format: uri
          readOnly: true
          type: string
        accepted:
          type: boolean
        finished:
          type: boolean
        items_answered:
          format: int64
          type: integer
        late:
          description: Ответ пришёл после дедлайна задания и засчитан как неверный
          type: boolean
        session:
